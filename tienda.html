<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tienda — De Raíz Floricultura</title>
  <meta name="description" content="Plantas, macetas, cuidados y regalos. Comprá online y retirá en el vivero o recibí en tu casa.">
  <meta name="theme-color" content="#333D29">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌿</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
  <script>
    /* Aplica el tema guardado antes de dibujar, para que no parpadee */
    (function () {
      try {
        var t = localStorage.getItem('dr_tema');
        if (t !== 'claro' && t !== 'oscuro') {
          t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'oscuro' : 'claro';
        }
        document.documentElement.setAttribute('data-tema', t);
      } catch (e) {}
    })();
  </script>
</head>
<body data-page="tienda">

<main class="contenedor">

  <div class="pagina-cabeza">
    <h1 class="seccion__titulo" id="tienda-titulo">Toda la tienda</h1>
    <p class="seccion__sub" id="tienda-sub">Plantas, macetas y todo para cuidarlas.</p>
  </div>

  <nav class="chips" id="chips-categorias" aria-label="Categorías"></nav>
  <nav class="chips" id="chips-sub" aria-label="Filtros" hidden></nav>

  <div class="tienda-barra">
    <span class="tienda-cuenta" id="tienda-cuenta"></span>
    <label>
      <span class="visualmente-oculto" hidden>Ordenar</span>
      <select class="orden-select" id="orden" aria-label="Ordenar productos">
        <option value="destacados">Destacados</option>
        <option value="precio-asc">Menor precio</option>
        <option value="precio-desc">Mayor precio</option>
        <option value="nombre">A – Z</option>
      </select>
    </label>
  </div>

  <div class="grid-productos" id="tienda-grid"></div>

  <div class="estado-centrado" id="tienda-vacio" hidden>
    <span class="estado-centrado__icono"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M19 5C11 5 5.5 10 5.5 19c9 0 13.5-5.5 13.5-14Z"/><path d="M5.5 19C9 13.5 13 9.5 19 5"/></svg></span>
    <h2 class="seccion__titulo">No encontramos productos</h2>
    <p>Probá con otra categoría, o escribinos y lo conseguimos para vos.</p>
    <a class="btn btn--verde" href="tienda.html">Ver todo</a>
  </div>

</main>

<script src="assets/js/config.js"></script>
<script src="assets/js/products.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/main.js"></script>
</body>
</html>
